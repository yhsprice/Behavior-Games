<!-- HERO -->
<section class="card hero">
  <div class="site-logo-wrap">
    <img src="RoxyRealityCheck.png" class="site-logo" />
  </div>

  <div class="hero-buttons">
    <button class="primary-btn" onclick="goHome()">Play Games</button>
    <button class="secondary-btn" onclick="showScreen('tracker')">Goal Tracker</button>
  </div>
</section>

<!-- HOME SCREEN -->
<section id="home-screen" class="card">
  <h2>Game Categories</h2>
  <p>Pick a category and answer real-life questions.</p>

  <div class="game-setting-box">
    <label><strong>How many questions?</strong></label>
    <select id="question-count-select">
      <option value="5">5 Questions</option>
      <option value="10">10 Questions</option>
      <option value="15">15 Questions</option>
      <option value="20">20 Questions</option>
      <option value="all">All Questions</option>
    </select>
  </div>

  <div class="category-grid">
    <button class="category-btn" onclick="startGame('beginner')">
      <span class="category-name">Beginner</span>
    </button>

    <button class="category-btn" onclick="startGame('advanced')">
      <span class="category-name">Advanced</span>
    </button>

    <button class="category-btn" onclick="startGame('mixed')">
      <span class="category-name">Mixed Practice</span>
    </button>
  </div>

  <h3 style="margin-top:25px;color:#2f67ea;">Advanced Practice</h3>
  <p>Practice real-life conversations and responses.</p>

  <div class="category-grid">
    <button class="category-btn" onclick="startConversationPractice()">
      <span class="category-name">Conversation Practice</span>
    </button>
  </div>
</section>

<!-- GAME SCREEN -->
<section id="game-screen" class="card hidden">
  <div class="top-row">
    <h2 id="game-title">Game</h2>
    <button onclick="goHome()">Back</button>
  </div>
  
<div id="score-text">Score: 0</div>
  
  <div id="question-box">
    <h3 id="question-text"></h3>
    <div id="answer-buttons"></div>
    <div id="feedback-box"></div>
    <button id="next-btn" onclick="nextQuestion()">Next</button>
  </div>
</section>

<!-- RESULTS -->
<section id="results-screen" class="card hidden">
  <h2>Results</h2>
  <div id="results-score"></div>
  <button onclick="goHome()">Back</button>
</section>
